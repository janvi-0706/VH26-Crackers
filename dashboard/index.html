<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PULSE</title>
    <script>
      // If the user double-clicks the file, redirect them to the local server
      if (window.location.protocol === 'file:') {
        window.location.href = 'http://localhost:8000';
      }
    </script>
    <style>
      .retro-sky {
        position: fixed;
        inset: 0;
        z-index: -10;
        background: linear-gradient(to bottom, #070020 0%, #0a0440 45%, #050a30 50%, #000000 50%, #000000 100%);
        overflow: hidden;
      }
      
      .neon-grid-plane {
        position: absolute;
        width: 200vw;
        height: 100vh;
        left: -50vw;
        top: 50%;
        background-image:
          linear-gradient(rgba(0, 255, 204, 0.8) 2px, transparent 2px),
          linear-gradient(90deg, rgba(0, 255, 204, 0.8) 2px, transparent 2px);
        background-size: 50px 50px;
        transform: perspective(300px) rotateX(75deg);
        transform-origin: top center;
        z-index: -9;
      }

      .pixel-star {
        position: absolute;
        width: 4px;
        height: 4px;
        background-color: #00ffcc;
        box-shadow: 0 0 5px #00ffcc;
      }

      /* Basic pixel cloud shapes using box-shadow */
      .pixel-cloud {
        position: absolute;
        width: 10px;
        height: 10px;
        background-color: white;
        z-index: -8;
      }
      
      .cloud-1 {
        bottom: 50%;
        left: 20%;
        box-shadow:
          10px 0 white, 20px 0 white, 30px 0 white, 40px 0 white, 50px 0 white, 60px 0 white, 70px 0 white, 80px 0 white, 90px 0 white, 100px 0 white,
          10px -10px white, 20px -10px white, 30px -10px white, 40px -10px white, 50px -10px white, 60px -10px white, 70px -10px white, 80px -10px white, 90px -10px white,
          20px -20px white, 30px -20px white, 40px -20px white, 50px -20px white, 60px -20px white, 70px -20px white, 80px -20px white,
          30px -30px white, 40px -30px white, 50px -30px white, 60px -30px white, 70px -30px white,
          40px -40px white, 50px -40px white, 60px -40px white;
      }

      .cloud-2 {
        bottom: 50%;
        right: 30%;
        box-shadow:
          10px 0 white, 20px 0 white, 30px 0 white, 40px 0 white, 50px 0 white, 60px 0 white, 70px 0 white, 80px 0 white, 90px 0 white, 100px 0 white, 110px 0 white,
          10px -10px white, 20px -10px white, 30px -10px white, 40px -10px white, 50px -10px white, 60px -10px white, 70px -10px white, 80px -10px white, 90px -10px white, 100px -10px white,
          20px -20px white, 30px -20px white, 40px -20px white, 50px -20px white, 60px -20px white, 70px -20px white, 80px -20px white, 90px -20px white,
          40px -30px white, 50px -30px white, 60px -30px white, 70px -30px white,
          50px -40px white, 60px -40px white;
      }

      .moon-green {
        position: absolute;
        background-color: #00ff00;
        width: 20px;
        height: 20px;
        top: 15%;
        left: 15%;
        box-shadow: 0 0 10px #00ff00;
        border-radius: 5px; /* Blocky circle */
      }

      .moon-cyan {
        position: absolute;
        background-color: #00ccff;
        width: 16px;
        height: 16px;
        top: 8%;
        right: 15%;
        box-shadow: 0 0 8px #00ccff;
        border-radius: 4px; /* Blocky circle */
      }
    </style>
  </head>
  <body class="text-ink text-shadow-sm">
    <div class="retro-sky">
      <div class="neon-grid-plane"></div>
      
      <!-- Celestial bodies -->
      <div class="moon-green"></div>
      <div class="moon-cyan"></div>

      <!-- Clouds -->
      <div class="pixel-cloud cloud-1"></div>
      <div class="pixel-cloud cloud-2"></div>

      <!-- Stars -->
      <div class="pixel-star" style="top: 18%; left: 8%; width: 3px; height: 3px; background-color: #00ff00; box-shadow: 0 0 5px #00ff00;"></div>
      <div class="pixel-star" style="top: 14%; left: 12%; width: 2px; height: 2px; background-color: #00ff00;"></div>
      <div class="pixel-star" style="top: 22%; left: 14%; width: 2px; height: 2px; background-color: #00ff00;"></div>
      
      <div class="pixel-star" style="top: 46%; left: 8%; width: 4px; height: 4px; background-color: #00ff00; box-shadow: 0 0 5px #00ff00;"></div>
      <div class="pixel-star" style="top: 34%; left: 45%; width: 4px; height: 4px; background-color: #00ff00;"></div>
      <div class="pixel-star" style="top: 35%; left: 60%; width: 5px; height: 5px; background-color: #00ff00;"></div>

      <div class="pixel-star" style="top: 5%; left: 52%; width: 3px; height: 3px; background-color: #ff6600; box-shadow: 0 0 5px #ff6600;"></div>
      <div class="pixel-star" style="top: 18%; right: 28%; width: 3px; height: 3px; background-color: #00ccff; box-shadow: 0 0 5px #00ccff;"></div>
      <div class="pixel-star" style="top: 20%; right: 18%; width: 4px; height: 4px; background-color: #00ccff;"></div>
      <div class="pixel-star" style="top: 28%; right: 10%; width: 5px; height: 5px; background-color: #00ccff; box-shadow: 0 0 5px #00ccff;"></div>
      <div class="pixel-star" style="top: 40%; right: 5%; width: 3px; height: 3px; background-color: #00ccff;"></div>
      <div class="pixel-star" style="top: 45%; right: 12%; width: 2px; height: 2px; background-color: #00ccff;"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
