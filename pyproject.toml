[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pulse-triage"
version = "0.1.0"
description = "PULSE — adaptive event pipeline that survives a 20x spike by triaging, not scaling"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",  # transport for FastAPI's TestClient
]
# Only needed when DATABASE_URL points at a real Postgres/Supabase
# instance (pg_compat.py imports psycopg2 lazily, inside PGConnection
# itself, specifically so the base install/demo never needs this).
postgres = [
    "psycopg2-binary>=2.9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
